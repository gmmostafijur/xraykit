<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>My account — XRayKit</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <style>
      :root { --bg:#06090a; --panel:#0d1310; --ink:#e9f2ec; --ink-soft:#b7c6bb; --ink-faint:#7d8f83; --line:#22302a; --lime:#9be315; --lime-ink:#131a05; --scan:#38d6f5; --radius:18px; }
      * { box-sizing:border-box; }
      body { margin:0; background: radial-gradient(700px 320px at 85% -5%, rgba(155,227,21,.14), transparent 60%), radial-gradient(600px 300px at 0% 110%, rgba(14,125,153,.16), transparent 60%), var(--bg); color:var(--ink); font-family:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif; font-size:16px; line-height:1.55; -webkit-font-smoothing:antialiased; }
      a { color:inherit; }
      :focus-visible { outline:3px solid var(--scan); outline-offset:3px; border-radius:4px; }
      .wrap { max-width:1160px; margin:0 auto; padding:0 20px; }
      .topbar { position:sticky; top:0; z-index:40; background:rgba(6,9,10,.88); backdrop-filter:blur(10px); border-bottom:1px solid var(--line); }
      .topbar-in { display:flex; align-items:center; gap:16px; min-height:60px; flex-wrap:wrap; padding-top:6px; padding-bottom:6px; }
      .wordmark { display:flex; align-items:center; gap:10px; text-decoration:none; font-weight:900; letter-spacing:.04em; font-size:20px; }
      .wordmark .xr { display:inline-flex; align-items:center; justify-content:center; width:34px; height:34px; border-radius:7px; background:#000; color:var(--lime); font-weight:900; font-size:15px; box-shadow:inset 0 0 0 1px rgba(155,227,21,.35); }
      .topnav { margin-left:auto; display:flex; align-items:center; gap:2px; flex-wrap:wrap; }
      .topnav a { text-decoration:none; font-size:14px; font-weight:600; color:var(--ink-soft); padding:10px 11px; min-height:40px; display:inline-flex; align-items:center; border-radius:8px; }
      .topnav a:hover { color:var(--ink); }
      .topnav a.active { color:var(--ink); box-shadow:inset 0 -3px 0 var(--scan); }
      .btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:44px; padding:10px 20px; font-family:inherit; font-size:15px; font-weight:700; text-decoration:none; cursor:pointer; border:2px solid var(--ink); border-radius:10px; background:var(--panel); color:var(--ink); }
      .btn:hover { transform:translateY(-1px); }
      .btn-lime { background:var(--lime) !important; border-color:var(--lime-ink) !important; color:var(--lime-ink) !important; }
      .acct-wrap { max-width:720px; margin:0 auto; padding:56px 20px 90px; }
      .acct-wrap h1 { font-size:36px; line-height:1.1; margin:0 0 8px; letter-spacing:-0.01em; }
      .acct-sub { color:var(--ink-soft); margin:0 0 26px; font-size:16px; }
      .acct-card { background:linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,.015)), var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:28px 28px 24px; }
      .acct-row { display:flex; justify-content:space-between; gap:16px; padding:13px 0; border-bottom:1px solid var(--line); font-size:15px; }
      .acct-row:last-of-type { border-bottom:none; }
      .acct-row .k { font-family:"IBM Plex Mono",monospace; font-size:12px; letter-spacing:.07em; text-transform:uppercase; color:var(--ink-faint); padding-top:3px; flex:none; }
      .acct-row .v { font-weight:700; text-align:right; overflow-wrap:anywhere; }
      .acct-row .v.pro { color:var(--lime); }
      .acct-actions { display:flex; gap:10px; flex-wrap:wrap; margin-top:24px; }
      .acct-actions .btn { flex:1; justify-content:center; }
      .acct-msg { min-height:22px; font-weight:600; margin:14px 0 0; font-size:14px; color:var(--ink-faint); }
      @media (max-width:820px) { .topnav { margin-left:0; width:100%; } }
    </style>
  </head>
  <body>
    <header class="topbar">
      <div class="wrap topbar-in">
        <a class="wordmark" href="index.html" aria-label="XRayKit home"><span class="xr">XR</span>XRayKit</a>
        <nav class="topnav" aria-label="Main menu">
          <a href="audit.html">Free Audit</a>
          <a href="index.html#/pricing">Pricing</a>
          <a href="index.html#/faq">FAQ</a>
          <a href="index.html#/contact">Contact</a>
          <a href="account.html" class="active">My account</a>
          <a class="btn btn-lime btn-small" href="index.html#/pricing">Try Pro free</a>
        </nav>
      </div>
    </header>
    <main class="acct-wrap">
      <h1>My account</h1>
      <p class="acct-sub">Your XRayKit plan and usage.</p>
      <div class="acct-card">
        <div class="acct-row"><span class="k">Email</span><span class="v" id="acctEmail">&hellip;</span></div>
        <div class="acct-row"><span class="k">Plan</span><span class="v" id="acctPlan">&hellip;</span></div>
        <div class="acct-row"><span class="k">Trial ends</span><span class="v" id="acctTrial">&mdash;</span></div>
        <div class="acct-row"><span class="k">Audits this month</span><span class="v" id="acctUsage">&hellip;</span></div>
        <div class="acct-actions">
          <a class="btn btn-lime" href="audit.html">Go to audit</a>
          <a class="btn" href="index.html#/pricing">Manage plan</a>
          <button class="btn" type="button" id="logoutBtn">Log out</button>
        </div>
        <p class="acct-msg" id="acctMsg">Loading your account&hellip;</p>
      </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="nav-auth.js"></script>
    <script>
      (function () {
        "use strict";
        var sb = window.supabase.createClient("https://elbddcclcmmpqdxsdahg.supabase.co", "sb_publishable_hQlsoIPtOA5buM9KWk0pow_aa9t5OAI");
        function fmtDate(iso) { var d = new Date(iso); return d.toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" }); }
        var msg = document.getElementById("acctMsg");
        sb.auth.getSession().then(function (res) {
          var user = res.data && res.data.session && res.data.session.user;
          if (!user) { window.location.href = "auth.html"; return; }
          document.getElementById("acctEmail").textContent = user.email || "\u2014";
          sb.rpc("my_plan").then(function (r) {
            if (r.error || !r.data) { if (msg) msg.textContent = "Could not load your plan \u2014 try refreshing."; return; }
            var plan = r.data.plan || "free";
            var planEl = document.getElementById("acctPlan");
            var trialEl = document.getElementById("acctTrial");
            var usageEl = document.getElementById("acctUsage");
            if (plan === "pro" && r.data.trial_ends_at) {
              planEl.textContent = "Pro (trial)";
              planEl.classList.add("pro");
              trialEl.textContent = fmtDate(r.data.trial_ends_at);
            } else if (plan === "pro") {
              planEl.textContent = "Pro";
              planEl.classList.add("pro");
              trialEl.textContent = "\u2014";
            } else {
              planEl.textContent = "Free";
              trialEl.textContent = "\u2014";
            }
            var limit = plan === "pro" ? 30 : 1;
            usageEl.textContent = (r.data.audits_used || 0) + " of " + limit;
            if (msg) msg.textContent = "";
          });
        });
        var out = document.getElementById("logoutBtn");
        if (out) out.addEventListener("click", async function () { await sb.auth.signOut(); window.location.href = "auth.html"; });
      })();
    </script>
  </body>
</html>
